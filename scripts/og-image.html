<!doctype html>
<!--
  Source for public/og-image.png, the preview card shown when the site link is shared
  (LinkedIn, Slack, iMessage...). To regenerate after changing the text: open this file
  in a browser with a 1200x630 viewport and take a screenshot, e.g. with Playwright:
    npx playwright screenshot --viewport-size=1200,630 scripts/og-image.html public/og-image.png
-->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #000;
    background-image:
      linear-gradient(rgba(58, 58, 58, 0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(58, 58, 58, 0.35) 1px, transparent 1px);
    background-size: 60px 60px;
    font-family: 'Inter', 'Liberation Sans', Arial, sans-serif;
    color: #E5E5E5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .window {
    width: 1080px;
    height: 510px;
    border: 2px solid #3A3A3A;
    border-radius: 24px;
    background: rgba(10, 10, 10, 0.92);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .titlebar {
    background: #1A1A1A;
    border-bottom: 1px solid #3A3A3A;
    padding: 20px 28px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .dots { display: flex; gap: 12px; }
  .dots span { width: 18px; height: 18px; border-radius: 50%; background: #2A2A2A; border: 1px solid #3A3A3A; }
  .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  .prompt { font-size: 24px; color: #9A9A9A; }
  .body { flex: 1; padding: 56px 64px; display: flex; flex-direction: column; justify-content: space-between; }
  h1 { font-size: 92px; font-weight: 800; letter-spacing: -2px; color: #fff; line-height: 1.05; }
  .role { font-size: 36px; color: #CFCFCF; margin-top: 22px; font-weight: 600; }
  .sub { font-size: 28px; color: #9A9A9A; margin-top: 12px; }
  .footer { display: flex; justify-content: space-between; align-items: flex-end; }
  .url { font-size: 24px; color: #9A9A9A; }
  .url b { color: #fff; font-weight: 400; }
  .logo { width: 76px; height: 76px; }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <span class="prompt mono">~/about$</span>
    </div>
    <div class="body">
      <div>
        <h1>Mateusz Pawłowski</h1>
        <div class="role">AI / Automation Associate · Reyes Holdings</div>
        <div class="sub">Information Technology graduate · DePaul University</div>
      </div>
      <div class="footer">
        <span class="url mono"><b>mpawlowski5467.github.io</b>/mateusz-pawlowski-portfolio</span>
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="1" y="1" width="62" height="62" rx="14" fill="#000" stroke="#5A5A5A" stroke-width="2"/>
          <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter">
            <path d="M10 46V18l11 16 11-16v28"/>
            <path d="M40 46V18h7a8 8 0 0 1 0 16h-7"/>
          </g>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
